name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src\TableSnip\TableSnip.csproj -c Release

      - name: Publish distributable
        shell: pwsh
        run: .\publish.ps1

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: TableSnip-win-x64
          path: dist/TableSnip-win-x64.zip
