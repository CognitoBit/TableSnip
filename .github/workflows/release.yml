name: Release

# Push a tag like v1.0.0 and this builds the zip and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish distributable
        shell: pwsh
        run: .\publish.ps1

      - name: Name the zip after the tag
        shell: pwsh
        run: Copy-Item dist\TableSnip-win-x64.zip "dist\TableSnip-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TableSnip-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true

      - name: Upload zip (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: TableSnip-win-x64
          path: dist/TableSnip-win-x64.zip
