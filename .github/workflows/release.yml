name: Release

# Push a tag like v1.2.3 and this builds the installer and portable zip on a Windows runner and
# attaches both to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }
          .\publish.ps1 -Installer -Version $v

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TableSnip-Setup-*.exe
            dist/TableSnip-*-win-x64.zip
          generate_release_notes: true

      - name: Upload artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: TableSnip-win-x64
          path: |
            dist/TableSnip-Setup-*.exe
            dist/TableSnip-*-win-x64.zip
